<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ноты — полноэкранный поиск</title><style>
*{box-sizing:border-box}body{max-width:430px;min-height:100dvh;margin:0 auto;background:#fff;color:#181717;font:16px Arial,sans-serif}button,input{font:inherit}.bar{height:72px;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e1e1e1}.logo{font-weight:700;color:#167354}.square{width:48px;height:48px;padding:0;border:0;border-radius:16px;background:#f1f1f1;display:grid;place-items:center;color:inherit;cursor:pointer}.menu{font-size:22px}.hero{height:208px;padding:24px 12px;display:flex;align-items:end;background:linear-gradient(135deg,#174d40,#7da481);color:white}.hero h1{margin:0;font-size:48px;font-weight:500;letter-spacing:-2px}.content{padding:32px 12px}.controls,.filters{display:flex;gap:4px;overflow:auto;scrollbar-width:none}.filter{height:48px;padding:0 16px;white-space:nowrap;border:0;border-radius:99px;background:#f1f1f1}.filter.active{background:#181717;color:#fff}.row{display:grid;grid-template-columns:32px 1fr;gap:8px;padding:16px 0;border-top:1px solid #d8d8d8}.down{font-size:24px;text-align:center}.name{font-size:18px;line-height:1.2}.choir{margin-top:6px;color:#71717a;font-size:15px}.screen{position:fixed;inset:0;display:none;max-width:430px;margin:auto;padding:12px;background:#fff}.screen.open{display:block}.screen-head{height:48px;display:flex;align-items:center;gap:12px;margin-bottom:28px}.screen h2{margin:0;font-size:20px;font-weight:500}.back{border-radius:50%;font-size:24px}.field{width:100%;height:56px;padding:0 16px;border:1px solid #aaa;border-radius:16px;outline-color:#167354}.caption{margin:28px 0 8px;color:#71717a;font-size:14px}.result{padding:18px 0;border-top:1px solid #d8d8d8}.result strong{font-size:18px;font-weight:500}.result span{display:block;margin-top:6px;color:#71717a;font-size:15px}
</style></head><body>
<header class="bar"><b class="logo">ОРЛЯТА</b><button class="square menu" aria-label="Меню">☰</button></header><section class="hero"><h1>Ноты</h1></section><main class="content"><div class="controls"><button class="square trigger" aria-label="Искать ноты"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><div class="filters"><button class="filter active">Все</button><button class="filter">Младший</button><button class="filter">Старший</button></div></div><article class="row" style="margin-top:32px"><span class="down">↓</span><div><div class="name">Boléro / M. Ravel</div><div class="choir">Старший хор</div></div></article><article class="row"><span class="down">↓</span><div><div class="name">Ave Maria / F. Schubert</div><div class="choir">Младший хор</div></div></article></main><section class="screen" role="dialog" aria-label="Поиск нот"><div class="screen-head"><button class="square back" aria-label="Закрыть поиск">×</button><h2>Поиск нот</h2></div><input class="field" type="search" placeholder="Название или автор"><p class="caption">Результаты</p><article class="result"><strong>Boléro / M. Ravel</strong><span>Старший хор</span></article><article class="result"><strong>Ave Maria / F. Schubert</strong><span>Младший хор</span></article><article class="result"><strong>Gloria / A. Vivaldi</strong><span>Юноши</span></article></section><script>const t=document.querySelector(".trigger"),s=document.querySelector(".screen"),b=document.querySelector(".back"),f=document.querySelector(".field");t.onclick=()=>{s.classList.add("open");f.focus()};b.onclick=()=>s.classList.remove("open");</script></body></html>
