<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ноты — нижняя панель поиска</title><style>
*{box-sizing:border-box}body{max-width:430px;min-height:100dvh;margin:0 auto;background:#fff;color:#181717;font:16px Arial,sans-serif}button,input{font:inherit}.bar{height:72px;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e1e1e1}.logo{font-weight:700;color:#167354}.square{width:48px;height:48px;padding:0;border:0;border-radius:16px;background:#f1f1f1;display:grid;place-items:center;color:inherit;cursor:pointer}.menu{font-size:22px}.hero{height:208px;padding:24px 12px;display:flex;align-items:end;background:linear-gradient(135deg,#174d40,#7da481);color:white}.hero h1{margin:0;font-size:48px;font-weight:500;letter-spacing:-2px}.content{padding:32px 12px 80px}.controls{display:flex;gap:4px;overflow:hidden}.filters{display:flex;gap:4px;overflow:auto;scrollbar-width:none}.filter{height:48px;padding:0 16px;white-space:nowrap;border:0;border-radius:99px;background:#f1f1f1}.filter.active{background:#181717;color:white}.caption{margin:32px 0 8px;color:#71717a;font-size:14px}.row{display:grid;grid-template-columns:32px 1fr;gap:8px;padding:16px 0;border-top:1px solid #d8d8d8}.down{font-size:24px;text-align:center}.name{font-size:18px;line-height:1.2}.choir{margin-top:6px;color:#71717a;font-size:15px}.scrim{display:none;position:fixed;inset:0;background:#0005}.sheet{position:fixed;right:0;bottom:0;left:0;max-width:430px;margin:auto;padding:10px 12px 28px;border-radius:24px 24px 0 0;background:#fff;box-shadow:0 -16px 40px #0003;transform:translateY(105%);transition:transform .28s ease}.open .scrim{display:block}.open .sheet{transform:translateY(0)}.handle{width:40px;height:4px;margin:0 auto 20px;border-radius:5px;background:#c8c8c8}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheet h2{margin:0;font-size:20px;font-weight:500}.close{width:40px;height:40px;border-radius:50%;font-size:24px}.field{width:100%;height:56px;padding:0 16px;border:1px solid #aaa;border-radius:16px;outline-color:#167354}.hint{margin:12px 0 0;color:#71717a;font-size:14px;line-height:1.4}
</style></head><body>
<header class="bar"><b class="logo">ОРЛЯТА</b><button class="square menu" aria-label="Меню">☰</button></header><section class="hero"><h1>Ноты</h1></section><main class="content"><div class="controls"><button class="square trigger" aria-label="Искать ноты" aria-expanded="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><div class="filters"><button class="filter active">Все</button><button class="filter">Младший</button><button class="filter">Старший</button><button class="filter">Юноши</button></div></div><p class="caption">Найдено 24 произведения</p><article class="row"><span class="down">↓</span><div><div class="name">Boléro / M. Ravel</div><div class="choir">Старший хор</div></div></article><article class="row"><span class="down">↓</span><div><div class="name">Ave Maria / F. Schubert</div><div class="choir">Младший хор</div></div></article><article class="row"><span class="down">↓</span><div><div class="name">Gloria / A. Vivaldi</div><div class="choir">Юноши</div></div></article></main><div class="scrim"></div><section class="sheet" role="dialog" aria-label="Поиск нот"><div class="handle"></div><div class="sheet-head"><h2>Поиск нот</h2><button class="square close" aria-label="Закрыть">×</button></div><input class="field" type="search" placeholder="Название или автор"><p class="hint">Нижняя панель появляется только по запросу; таблица остаётся на месте.</p></section><script>const t=document.querySelector(".trigger"),c=document.querySelector(".close"),s=document.querySelector(".scrim"),f=document.querySelector(".field");function o(v){document.body.classList.toggle("open",v);t.setAttribute("aria-expanded",v);if(v)setTimeout(()=>f.focus(),150)}t.onclick=()=>o(true);c.onclick=s.onclick=()=>o(false);</script></body></html>
