map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
	listen 80;
	listen [::]:80;
	server_name 89.125.120.78;
	server_tokens off;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type text/plain;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name 89.125.120.78;
	server_tokens off;

	ssl_certificate /etc/letsencrypt/live/89.125.120.78/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/89.125.120.78/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_timeout 1d;
	ssl_session_cache shared:OrlyataTLS:10m;
	ssl_session_tickets off;

	add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	auth_basic "Orlyata staging";
	auth_basic_user_file /etc/nginx/.htpasswd;


	client_max_body_size 64m;

	location = /robots.txt {
		default_type text/plain;
		return 200 "User-agent: *\nAllow: /\n";
	}

	location = /storybook {
		return 302 /storybook-20260814/$is_args$args;
	}

	location /storybook/ {
		rewrite ^/storybook/(.*)$ /storybook-20260814/$1 redirect;
	}

	location = /storybook-20260814 {
		return 302 /storybook-20260814/$is_args$args;
	}

	location /storybook-20260814/ {
		root /var/www/public-artifacts;
		rewrite ^/storybook-20260814/(.*)$ /storybook/$1 break;
		try_files $uri $uri/ /storybook/index.html;

		add_header Cache-Control "no-store" always;
		add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	}

	location = /mailpit {
		return 301 /mailpit/;
	}

	location /mailpit/ {

		proxy_pass http://mailpit:8025;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
	}

	location / {
		proxy_pass http://wordpress:80;
		add_header Cache-Control "no-store" always;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-Port 443;
	}
}
